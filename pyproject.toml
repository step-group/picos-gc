[project]
name = "picos-gc"
version = "0.1.0"
description = "Automatic multi-peak detection and integration for Shimadzu GC .gcd files."
readme = "README.md"
authors = [
    { name = "Maximilian Fleckenstein", email = "maximilianfv@uc.cl" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "olefile>=0.47",
    "scipy>=1.14",
    "pybaselines>=1.1",
    "pcsaft-quaternary",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
picos-gc = "picos_gc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.7",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]  # long help strings; line length is advisory here

[tool.mypy]
python_version = "3.13"
packages = ["picos_gc"]
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true  # scipy / olefile / matplotlib ship no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv.workspace]
members = [
    "pcsaft-quaternary",
]

[tool.uv.sources]
pcsaft-quaternary = { workspace = true }
